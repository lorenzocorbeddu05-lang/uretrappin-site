<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodotto — U'RE TRAPPIN</title>
<!-- Questi tag sono valori generici di partenza: js/product.js li
     aggiorna col prodotto giusto (nome/prezzo/foto) non appena
     data/products.json è caricato — vedi updateProductMeta(). -->
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<meta name="description" content="Scopri i prodotti U're Trappin: T-shirt, felpe, cappelli e accessori.">
<meta property="og:type" content="product">
<meta property="og:site_name" content="U're Trappin">
<meta property="og:title" content="Prodotto — U'RE TRAPPIN">
<meta property="og:description" content="Scopri i prodotti U're Trappin.">
<meta property="og:image" content="assets/brand/logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prodotto — U'RE TRAPPIN">
<meta name="twitter:description" content="Scopri i prodotti U're Trappin.">
<meta name="twitter:image" content="assets/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Baloo+2:wght@600;800&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== SCHERMATA DI CARICAMENTO =====
     Overlay a schermo intero, visibile finché la pagina non ha finito
     di caricare (immagini incluse). Sparisce da solo via js/common.js
     (vedi funzione hidePageLoader). -->
<div id="pageLoader">
  <img src="assets/brand/logo2.png" alt="U're Trappin" class="loader-logo">
</div>

<div id="nav-mount"></div>

<!-- ===== PAGINA PRODOTTO =====
     Contenuto generato da js/product.js (funzione loadProductDetail),
     leggendo data/products.json in base al parametro ?id= nell'URL
     (es. product.html?id=1). Per aggiungere/modificare un prodotto
     basta editare products.json, non serve toccare questo HTML. -->
<section class="product-page" id="productPage">
  <div class="product-gallery">
    <img class="product-main-photo" id="productMainPhoto" src="" alt="">
    <div class="product-thumbs" id="productThumbs"></div>
  </div>

  <div class="product-info">
    <div class="eyebrow" id="productVariant"></div>
    <h1 class="product-title" id="productName"></h1>
    <p class="product-price" id="productPrice"></p>
    <p class="product-availability" id="productAvailability"></p>

    <div class="product-field" id="sizeField">
      <label class="product-field-label" for="sizeSelect">Taglia</label>
      <div class="product-select-wrap">
        <select class="product-size-select" id="sizeSelect"></select>
      </div>
    </div>

    <a class="product-buy-btn" id="buyButton" href="#" target="_blank" rel="noopener">Acquista</a>

    <!-- Badge metodi di pagamento (Visa/Mastercard/PayPal/Apple Pay)
         rimossi finché non sappiamo quali attiverete su Stripe — da
         rimettere quando saranno definitivi. -->

    <div class="product-accordion">
      <div class="accordion-item">
        <button class="accordion-trigger" type="button">Dettagli</button>
        <div class="accordion-panel">
          <div class="accordion-panel-inner">
            <ul class="accordion-list" id="productDetails"></ul>
          </div>
        </div>
      </div>
      <!-- Spedizione e Resi sono uguali per tutti i prodotti, quindi il
           testo è scritto qui una sola volta invece che ripetuto in
           ogni voce di data/products.json. Per modificarlo basta
           editare questo blocco. -->
      <div class="accordion-item">
        <button class="accordion-trigger" type="button">Spedizione</button>
        <div class="accordion-panel">
          <div class="accordion-panel-inner">
            <p>Testo spedizione.</p>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <button class="accordion-trigger" type="button">Resi</button>
        <div class="accordion-panel">
          <div class="accordion-panel-inner">
            <p>Testo resi.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== ALTRI PRODOTTI =====
     Riga orizzontale scorrevole col resto dei prodotti (tutti tranne
     quello in pagina), generata da js/product.js insieme al resto dei
     dati (stessa fetch di products.json, nessuna richiesta in più). -->
<section class="related-products">
  <div class="eyebrow">// Altri prodotti</div>
  <div class="products-scroll" id="relatedProducts"></div>
</section>

<div id="footer-mount"></div>

<script src="js/common.js"></script>
<script src="js/shop.js"></script>
<script src="js/product.js"></script>

</body>
</html>
