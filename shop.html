<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="meta.shop.title">Negozio — U'RE TRAPPIN'</title>
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<meta name="description" content="Negozio ufficiale U're Trappin' — T-shirt, felpe, cappelli e accessori del brand." data-i18n-attr="content:meta.shop.desc">
<meta property="og:type" content="website">
<meta property="og:site_name" content="U're Trappin'">
<meta property="og:title" content="Negozio — U're Trappin'">
<meta property="og:description" content="T-shirt, felpe, cappelli e accessori del brand U're Trappin'.">
<meta property="og:image" content="assets/brand/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Negozio — U're Trappin'">
<meta name="twitter:description" content="T-shirt, felpe, cappelli e accessori del brand.">
<meta name="twitter:image" content="assets/brand/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Baloo+2:wght@600;800&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== SCHERMATA DI CARICAMENTO =====
     Overlay a schermo intero, visibile finché la pagina non ha finito
     di caricare (immagini incluse). Sparisce da solo via js/common.js
     (vedi window.addEventListener('load', ...)). -->
<div id="pageLoader">
  <img src="assets/brand/logo-principale.webp" alt="U're Trappin'" class="loader-logo">
</div>

<div id="nav-mount"></div>

<!-- ===== SHOP =====
     I prodotti sono generati automaticamente da js/shop.js,
     leggendo i dati da data/products.json. Per aggiungere/togliere
     un prodotto basta editare quel file, non serve toccare questo
     HTML. -->
<section class="shop-page">
  <div class="products-grid" id="productsGrid">
    <p class="no-events" data-i18n="shop.loading">Caricamento prodotti…</p>
  </div>
</section>

<div id="footer-mount"></div>

<script src="js/common.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
