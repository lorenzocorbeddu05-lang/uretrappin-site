<body>

<!-- ===== SCHERMATA DI CARICAMENTO =====
     Overlay a schermo intero, visibile finché la pagina non ha finito
     di caricare (immagini incluse). Sparisce da solo via js/common.js
     (vedi window.addEventListener('load', ...)). -->
<div id="pageLoader">
  <img src="assets/brand/logo2.png" alt="U're Trappin" class="loader-logo">
</div>

<div id="nav-mount"></div>

<!-- ===== SHOP =====
     I prodotti sono generati automaticamente da js/shop.js,
     leggendo i dati da data/products.json. Per aggiungere/togliere
     un prodotto basta editare quel file, non serve toccare questo
     HTML. -->
<section class="shop-page">
  <div class="eyebrow">// Shop</div>
  <div class="products-grid" id="productsGrid">
    <p class="no-events">Caricamento prodotti…</p>
  </div>
</section>

<div id="footer-mount"></div>

<script src="js/common.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
