<!-- ===== NAVBAR CONDIVISA =====
     Unica fonte per la navbar di tutte le pagine: js/common.js la
     carica via fetch e la inserisce al posto di <div id="nav-mount">.
     Per aggiungere/modificare una voce di menu basta editare questo
     file, non le singole pagine.

     I segnaposto {{ROOT}} vengono sostituiti da js/common.js con ''
     (pagine alla radice) o '../' (pagine dentro legali/), così i link
     funzionano da qualsiasi profondità senza duplicare il file. -->

<!-- ===== STRISCIA ANNUNCIO (sopra la navbar) =====
     Testo che scorre in loop, stile/animazione in css/style.css
     (.marquee, .marquee-track, .marquee-content, @keyframes
     marquee-scroll). Decorativa (aria-hidden), quindi esclusa dagli
     screen reader.

     Per cambiare il testo: modifica .marquee-item qui sotto (le due
     .marquee-content sono copie IDENTICHE — servono entrambe per il
     loop senza scatti, quindi ogni modifica va fatta in entrambe). -->
<div class="marquee" aria-hidden="true">
  <div class="marquee-track">
    <span class="marquee-content">
      <span class="marquee-item">First Drop Out Now</span>
      <span class="marquee-item">@u_are_trappin</span>
      <span class="marquee-item">First Drop Out Now</span>
      <span class="marquee-item">@u_are_trappin</span>
      <span class="marquee-item">First Drop Out Now</span>
      <span class="marquee-item">@u_are_trappin</span>
    </span>
    <span class="marquee-content">
      <span class="marquee-item">First Drop Out Now</span>
      <span class="marquee-item">@u_are_trappin</span>
      <span class="marquee-item">First Drop Out Now</span>
      <span class="marquee-item">@u_are_trappin</span>
      <span class="marquee-item">First Drop Out Now</span>
      <span class="marquee-item">@u_are_trappin</span>
    </span>
  </div>
</div>

<nav id="mainNav">
  <a class="brand" href="{{ROOT}}index.html">
    <img src="{{ROOT}}assets/brand/logo-navbar.png" alt="U're Trappin'" class="brand-logo">
  </a>
  <button class="nav-toggle" id="navToggle" aria-label="Apri menu" data-i18n-attr="aria-label:nav.menuOpen" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <!-- I testi delle voci sono quelli italiani (di riserva): quelli
       mostrati vengono da data/i18n.json tramite data-i18n, vedi
       js/common.js. L'ultima voce è il selettore di lingua IT/EN: su
       desktop sta a destra della navbar, su mobile in fondo al menu. -->
  <ul id="navMenu">
    <li><a href="{{ROOT}}index.html" data-i18n="nav.home">Home</a></li>
    <li><a href="{{ROOT}}shop.html" data-i18n="nav.shop">Negozio</a></li>
    <li><a href="{{ROOT}}gallery.html" data-i18n="nav.gallery">Archivio</a></li>
    <li><a href="{{ROOT}}index.html#music" data-i18n="nav.music">Musica</a></li>
    <li><a href="{{ROOT}}index.html#about" data-i18n="nav.about">Chi Siamo</a></li>
    <li class="lang-switch">
      <button type="button" class="lang-btn" data-lang="it" lang="it" aria-label="Italiano">IT</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button type="button" class="lang-btn" data-lang="en" lang="en" aria-label="English">EN</button>
    </li>
  </ul>
</nav>
<div id="menuOverlay"></div>
