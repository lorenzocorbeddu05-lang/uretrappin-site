<!-- ===== FOOTER CONDIVISO =====

     da js/common.js al posto di <div id="footer-mount">. Per
     aggiungere una voce a una categoria, aggiungi un altro <a> dentro
     il div.footer-category corrispondente, qui soltanto.

     {{ROOT}} = '' (pagine alla radice) o '../' (pagine in legali/).
     {{LEGALI}} = 'legali/' (dalla radice, per entrare nella cartella)
     o '' (già dentro legali/, i file sono fratelli). -->
<footer>

    <img src="{{ROOT}}assets/brand/logo-principale.webp" alt="U're Trappin'" class="footer-logo">

  <div class="footer-columns">
    <div class="footer-category">
      <h3 class="footer-heading">Links</h3>

      <a href="https://www.tiktok.com/@u_are_trappin?_r=1&_t=ZG-9858OtERrCz" target="_blank" rel="noopener">TikTok</a>
      <a href="https://chat.whatsapp.com/CYRBDifHxEv5SmKfIKUwr1" target="_blank" rel="noopener">WhatsApp</a>
    </div>

    <div class="footer-category">
      <h3 class="footer-heading" data-i18n="footer.sections">Sezioni sito</h3>
      <a href="{{ROOT}}shop.html" data-i18n="nav.shop">Negozio</a>
      <a href="{{ROOT}}gallery.html" data-i18n="nav.gallery">Archivio</a>
      <a href="{{ROOT}}index.html#music" data-i18n="nav.music">Musica</a>
      <a href="{{ROOT}}index.html#about" data-i18n="nav.about">Chi Siamo</a>

    <div class="footer-category">

      <a href="{{LEGALI}}privacy.html">Privacy Policy</a>
      <a href="{{LEGALI}}termini.html" data-i18n="footer.terms">Termini e Condizioni</a>
