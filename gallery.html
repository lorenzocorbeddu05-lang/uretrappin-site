<!-- ===== COUNTDOWN DROP =====
     Caricato da js/common.js (loadCountdown, condiviso da tutte le
     pagine) — impedisce di vedere/comprare il sito prima del lancio
     anche a chi apre questo URL direttamente. -->
<div id="countdown-root"></div>

<!-- ===== SCHERMATA DI CARICAMENTO =====
     Overlay a schermo intero, visibile finché la pagina non ha finito
     di caricare (immagini incluse). Sparisce da solo via js/common.js
     (vedi funzione hidePageLoader). -->
<div id="pageLoader">
  <img src="assets/brand/logo-hero-footer.webp" alt="U're Trappin'" class="loader-logo">
</div>

<div id="nav-mount"></div>

       disponibili. Su mobile tutte le foto si impilano in verticale
       (column-count:1), da desktop in su formano il collage "bento". -->

    <h2 class="city-name">Rimini</h2>
    <div class="venue-group">

      <div class="mosaic mosaic--9">
