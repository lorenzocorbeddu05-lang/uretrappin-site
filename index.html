<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U'RE TRAPPIN</title>
<!-- ===== SEO / CONDIVISIONE SOCIAL =====
     favicon segnaposto (assets/brand/favicon.png, sostituibile con
     un'icona vera quando ce n'è una). og:image è un percorso relativo:
     una volta online il sito con un dominio vero, va reso assoluto
     (https://tuodominio.it/assets/brand/logo2.png) perché WhatsApp/
     Instagram/Twitter leggano l'anteprima correttamente. -->
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<meta name="description" content="U're Trappin — merch, eventi e musica trap. Scopri gli ultimi drop, la gallery degli eventi e la nostra musica.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="U're Trappin">
<meta property="og:title" content="U're Trappin">
<meta property="og:description" content="Merch, eventi e musica trap. Scopri gli ultimi drop, la gallery e la nostra musica.">
<meta property="og:image" content="assets/brand/logo2.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="U're Trappin">
<meta name="twitter:description" content="Merch, eventi e musica trap.">
<meta name="twitter:image" content="assets/brand/logo2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Baloo+2:wght@600;800&family=Barlow+Condensed:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== COUNTDOWN DROP (rimuovi questo blocco + partials/countdown.html
     dopo il 28/09 — tutto lo stile e la logica sono dentro
     countdown.html, qui c'è solo il caricamento generico del
     frammento) ===== -->
<div id="countdown-root"></div>
<script>
  fetch('partials/countdown.html')
    .then(res => res.text())
    .then(html => {
      const root = document.getElementById('countdown-root');
      root.innerHTML = html;
      // Uno <script> inserito via innerHTML non si esegue da solo:
      // va ricreato e reinserito nel DOM per farlo partire.
      root.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        oldScript.replaceWith(newScript);
      });
    })
    .catch(err => console.error('Errore nel caricamento di partials/countdown.html:', err));
</script>
<!-- ===== FINE COUNTDOWN DROP ===== -->

<!-- ===== SCHERMATA DI CARICAMENTO =====
     Overlay a schermo intero, visibile finché la pagina non ha finito
     di caricare (immagini incluse). Sparisce da solo via js/common.js
     (vedi funzione hidePageLoader). -->
<div id="pageLoader">
  <img src="assets/brand/logo2.png" alt="U're Trappin" class="loader-logo">
</div>

<!-- ===== NAVBAR (condivisa, vedi partials/nav.html) ===== -->
<div id="nav-mount"></div>

<!-- ===== HERO (landing) =====
     Foto di sfondo + logo. Per cambiare la foto: modifica il
     percorso in css/style.css alla regola .hero::before -->
<section class="hero">
  <div class="hero-content">
    <img class="logo" src="assets/brand/logo2.png" alt="U're Trappin">
    <div class="tag">Lifestyle · Music · Trappin</div>
  </div>
  <div class="scroll-cue">Scroll ↓</div>
</section>

<!-- ===== SEZIONE SHOP (anteprima sulla home) =====
     Foto a piena larghezza (sfondo CSS, vedi style.css) + pulsante
     sopra. Foto diverse per mobile/desktop, gestite automaticamente
     da una media query in CSS — non serve toccare l'HTML per quello. -->
<section id="shop" class="teaser-banner">
  <a class="teaser-cta" href="shop.html">Vai allo Shop →</a>
</section>

<!-- ===== SEZIONE GALLERY (anteprima sulla home) =====
     Stessa logica della sezione Shop qui sopra. -->
<section id="gallery" class="teaser-banner">
  <a class="teaser-cta" href="gallery.html">Vedi tutte le foto →</a>
</section>

<!-- ===== SEZIONE EVENTI =====
     Le card evento sono generate automaticamente da js/events.js,
     leggendo i dati da data/events.json. Non serve modificare questo
     HTML per aggiungere un nuovo evento: basta editare events.json.
     Ogni card ha un fronte (locandina + pulsanti) e un retro (info),
     che si alternano con un effetto "flip" al click su "Info".
-->
<section id="eventi">
  <div class="eyebrow">// Eventi</div>
  <div class="events-grid" id="eventsGrid">
    <p class="no-events">Caricamento eventi…</p>
  </div>
  <p class="events-swipe-hint">← Scorri per vedere altri eventi →</p>
</section>

<!-- ===== SEZIONE MUSIC =====
     Player Spotify incorporato. Per cambiare playlist: sostituisci
     l'URL nel src dell'iframe con quello della tua playlist Spotify
     (Condividi > Incorpora playlist, sul sito/app di Spotify) -->
<section id="music">
  <div class="eyebrow">// Music</div>
  <div class="panel">
    <div class="panel-label">Spotify · U're Trappin</div>
    <div class="playlist-wrap">
      <iframe style="border-radius:0" src="https://open.spotify.com/embed/playlist/7722tCvP0Tci7ySR0g6ZQf?utm_source=generator&theme=0&si=49c74c0af75840aa" width="100%" height="380" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </div>
</section>

<!-- ===== SEZIONE ABOUT US ===== -->
<section id="about">
  <div class="eyebrow">// About Us</div>
  <div class="about">
    <div class="about-photo">
      <img src="assets/brand/coconuts-halftone.png" alt="U're Trappin crew">
    </div>
    <div>
      <p>CHI SIAMO</p>
      <p>Breve descrizione/presentazione</p>
      <p>...</p>
    </div>
  </div>
</section>

<!-- ===== FOOTER (condiviso, vedi partials/footer.html) ===== -->
<div id="footer-mount"></div>

<script src="js/common.js"></script>
<script src="js/events.js"></script>

</body>
</html>
