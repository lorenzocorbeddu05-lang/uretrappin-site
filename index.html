<!-- ===== COUNTDOWN DROP (rimuovi questo blocco + partials/countdown.html
     dopo il 28/09 — tutto lo stile e la logica sono dentro
     countdown.html, qui c'è solo il caricamento generico del
     frammento) ===== -->
<div id="countdown-root"></div>
<script>
  fetch('partials/countdown.html')
    .then(res => res.text())
    .then(html => {
      const root = document.getElementById('countdown-root');
      root.innerHTML = html;
      // Uno <script> inserito via innerHTML non si esegue da solo:
      // va ricreato e reinserito nel DOM per farlo partire.
      root.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        oldScript.replaceWith(newScript);
      });
    })
    .catch(err => console.error('Errore nel caricamento di partials/countdown.html:', err));
</script>
<!-- ===== FINE COUNTDOWN DROP ===== -->

<!-- ===== SCHERMATA DI CARICAMENTO =====
     Overlay a schermo intero, visibile finché la pagina non ha finito
     di caricare (immagini incluse). Sparisce da solo via js/common.js
     (vedi funzione hidePageLoader). -->
<div id="pageLoader">

</div>

<!-- ===== NAVBAR (condivisa, vedi partials/nav.html) ===== -->

<!-- ===== HERO (landing) =====
     Foto di sfondo + logo. Per cambiare la foto: modifica il
     percorso in css/style.css alla regola .hero::before -->
<section class="hero">
  <!-- ===== PROVA VIDEO DI SFONDO (temporaneo) =====
       Due video diversi: uno per desktop e uno per mobile (sotto i
       720px). Il src NON è scritto qui ma scelto da js/common.js in base
       alla larghezza dello schermo, così il browser scarica solo quello
       che serve (un <source media> dentro <video> non funziona, quello
       vale solo per <picture>). La foto di .hero::before in
       css/style.css resta lì sotto, e torna visibile da sola se il
       video non parte. Per togliere la prova: elimina questo <video>. -->
  <video class="hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto"
         data-src-desktop="assets/brand/hero-video-desktop.mp4"
         data-src-mobile="assets/brand/hero-video-mobile.mp4"></video>
  <div class="hero-content">

    <div class="tag">Events · Clothing · Music</div>
  </div>
  <div class="scroll-cue">Scroll ↓</div>
</section>
